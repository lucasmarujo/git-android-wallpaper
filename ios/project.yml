name: GitWallpaper
options:
  bundleIdPrefix: dev.marujo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: 8VRVBA2X7C
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    GITHUB_CLIENT_ID: Ov23liTIhSFDBloUNkci
packages:
  GitWallpaperKit:
    path: GitWallpaperKit
targets:
  GitWallpaper:
    type: application
    platform: iOS
    sources:
      - path: GitWallpaper
        excludes:
          - Info.plist
          - GitWallpaper.entitlements
    settings:
      base:
        PRODUCT_NAME: GitWallpaper
        PRODUCT_BUNDLE_IDENTIFIER: dev.marujo.gitwallpaper
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: GitWallpaper/Info.plist
        CODE_SIGN_ENTITLEMENTS: GitWallpaper/GitWallpaper.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          DEAD_CODE_STRIPPING: NO
    dependencies:
      - package: GitWallpaperKit
      - target: GitWallpaperWidget
  GitWallpaperWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GitWallpaperWidget
        excludes:
          - Info.plist
          - GitWallpaperWidget.entitlements
    settings:
      base:
        PRODUCT_NAME: GitWallpaperWidget
        PRODUCT_BUNDLE_IDENTIFIER: dev.marujo.gitwallpaper.widget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: GitWallpaperWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: GitWallpaperWidget/GitWallpaperWidget.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: GitWallpaperKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  GitWallpaperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GitWallpaperTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.marujo.gitwallpaper.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GitWallpaper
  GitWallpaperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GitWallpaperUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.marujo.gitwallpaper.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GitWallpaper
      - package: GitWallpaperKit
schemes:
  GitWallpaper:
    build:
      targets:
        GitWallpaper: all
        GitWallpaperTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GitWallpaperTests
    archive:
      config: Release
  GitWallpaperScreenshots:
    build:
      targets:
        GitWallpaper: all
        GitWallpaperUITests: [test]
    test:
      config: Debug
      targets:
        - GitWallpaperUITests
