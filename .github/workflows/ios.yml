name: iOS CI

on:
  push:
    branches: [main]
    tags: ['ios-v*']
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_PATH: /Applications/Xcode_26.6.app
  SIMULATOR: platform=iOS Simulator,name=iPhone 17

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Package tests (GitWallpaperKit)
        working-directory: ios/GitWallpaperKit
        run: xcodebuild -quiet test -scheme GitWallpaperKit -destination "$SIMULATOR" -resultBundlePath "$RUNNER_TEMP/GitWallpaperKit.xcresult"

      - name: Generate Xcode project
        if: ${{ !cancelled() }}
        working-directory: ios
        run: xcodegen generate

      - name: App tests and build
        if: ${{ !cancelled() }}
        working-directory: ios
        run: >
          xcodebuild -quiet test
          -project GitWallpaper.xcodeproj
          -scheme GitWallpaper
          -destination "$SIMULATOR"
          -resultBundlePath "$RUNNER_TEMP/GitWallpaper.xcresult"
          CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/GitWallpaperKit.xcresult
            ${{ runner.temp }}/GitWallpaper.xcresult

  testflight:
    if: startsWith(github.ref, 'refs/tags/ios-v')
    needs: test
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Decode App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        working-directory: ios
        run: >
          xcodebuild -quiet archive
          -project GitWallpaper.xcodeproj
          -scheme GitWallpaper
          -configuration Release
          -destination "generic/platform=iOS"
          -archivePath "$RUNNER_TEMP/GitWallpaper.xcarchive"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          MARKETING_VERSION="${GITHUB_REF_NAME#ios-v}"
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to TestFlight
        working-directory: ios
        run: >
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/GitWallpaper.xcarchive"
          -exportOptionsPlist ExportOptions.plist
          -exportPath "$RUNNER_TEMP/export"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
