name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'ios/**'
      - '.eas/**'
      - 'eas.json'
      - 'app.json'
      - '.github/workflows/release.yml'
      - '.github/release/**'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/release/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Google Play internal testing and TestFlight
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_NAME: Git Wallpaper
  ANDROID_PACKAGE: dev.marujo.gitwallpaper
  IOS_BUNDLE_ID: dev.marujo.gitwallpaper
  JAVA_VERSION: '21'
  EAS_CLI_VERSION: '27.10.0'
  FASTLANE_VERSION: '2.241.2'
  VERSION_CODE_OFFSET: '1000'
  TAG_PREFIX: v
  PLAY_RELEASE_STATUS: completed
  NOTES_LOCALE: en-US
  NOTES_FALLBACK: Bug fixes and improvements.
  NOTES_MAX_LENGTH: '500'

jobs:
  ci:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew testDebugUnitTest --console=plain

  plan:
    name: Version and destination
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      version_code: ${{ steps.plan.outputs.version_code }}
      track: ${{ steps.plan.outputs.track }}
      publish: ${{ steps.plan.outputs.publish }}
      ios: ${{ steps.plan.outputs.ios }}
      android_changed: ${{ steps.changes.outputs.android }}
      ios_changed: ${{ steps.changes.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint the workflow and test the release scripts
        if: github.event_name == 'pull_request'
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" .github/workflows/release.yml
          shellcheck .github/release/*.sh
          bash .github/release/release.test.sh
          node --test .github/release/app-store-connect.test.mjs

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          IOS_CONFIGURED: ${{ secrets.EXPO_TOKEN != '' && secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts) \
            IOS_VERSION=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)".*/\1/p' ios/project.yml) \
            bash .github/release/plan.sh | tee -a "$GITHUB_OUTPUT"
          echo "ios=$IOS_CONFIGURED" | tee -a "$GITHUB_OUTPUT"

      - name: Changed platforms
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" != push ] || [ "$GITHUB_REF_TYPE" = tag ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo "android=true" | tee -a "$GITHUB_OUTPUT"
            echo "ios=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if grep -qE '^(app/|gradle/|[^/]+\.gradle\.kts$|gradle\.properties$|\.github/)' <<< "$changed"; then android=true; else android=false; fi
          if grep -qE '^(ios/|\.eas/|eas\.json$|app\.json$|\.github/)' <<< "$changed"; then ios=true; else ios=false; fi
          echo "android=$android" | tee -a "$GITHUB_OUTPUT"
          echo "ios=$ios" | tee -a "$GITHUB_OUTPUT"

      - name: Summary
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          VERSION_CODE: ${{ steps.plan.outputs.version_code }}
          TRACK: ${{ steps.plan.outputs.track }}
          PUBLISH: ${{ steps.plan.outputs.publish }}
          IOS: ${{ steps.plan.outputs.ios }}
        run: |
          {
            echo "### $APP_NAME $VERSION (build $VERSION_CODE)"
            echo "- Destination: $TRACK"
            echo "- Publish: $PUBLISH"
            echo "- iOS configured: $IOS"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISH" = true ] && [ "$IOS" != true ]; then
            echo "::warning::EXPO_TOKEN or APP_STORE_CONNECT_API_KEY_BASE64 is missing: iOS is skipped in this run."
          fi

  android:
    name: Android
    needs: [ci, plan]
    if: >-
      needs.plan.outputs.android_changed == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_VERSION_CODE: ${{ needs.plan.outputs.version_code }}
      PLAY_ACCOUNT_CONFIGURED: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      IS_TAG: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_* secrets (see .github/release/README.md)."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Signed AAB, and the APK for the GitHub release on tags
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          tasks=(:app:bundleRelease)
          if [ "$IS_TAG" = true ]; then
            tasks+=(:app:assembleRelease)
          fi
          ./gradlew "${tasks[@]}" --console=plain             --init-script .github/release/android-version-code.gradle             "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.jks"             "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD"             "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS"             "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"

      - name: Check the signature and the versionCode
        id: aab
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash .github/release/check-aab.sh app "$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: android-aab-${{ needs.plan.outputs.version_code }}
          path: |
            ${{ steps.aab.outputs.aab }}
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Release notes
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          [ -z "$TAG" ] || git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          mkdir -p "$RUNNER_TEMP/whatsnew"
          bash .github/release/release-notes.sh "$NOTES_MAX_LENGTH" "$NOTES_FALLBACK" "$TAG" | tee "$RUNNER_TEMP/whatsnew/whatsnew-$NOTES_LOCALE"

      - name: Publish to Google Play
        if: needs.plan.outputs.publish == 'true' && env.PLAY_ACCOUNT_CONFIGURED == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE }}
          releaseFiles: ${{ steps.aab.outputs.aab }}
          releaseName: ${{ needs.plan.outputs.version }} (${{ needs.plan.outputs.version_code }})
          track: ${{ needs.plan.outputs.track }}
          status: ${{ env.PLAY_RELEASE_STATUS }}
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      - name: Google Play without a service account
        if: needs.plan.outputs.publish == 'true' && env.PLAY_ACCOUNT_CONFIGURED != 'true'
        run: echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is missing. The signed AAB is only an artifact of this run."

  ios:
    name: iOS
    needs: [ci, plan]
    if: >-
      needs.plan.outputs.ios_changed == 'true' &&
      needs.plan.outputs.publish == 'true' &&
      needs.plan.outputs.ios == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      IS_TAG: ${{ github.ref_type == 'tag' }}
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD_NUMBER: ${{ needs.plan.outputs.version_code }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: expo/expo-github-action@v9
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          bash .github/release/app-store-connect-key.sh eas.json "$RUNNER_TEMP"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc-api-key.p8" >> "$GITHUB_ENV"
          echo "ASC_APP_ID=$(jq -r '.submit.production.ios.ascAppId' eas.json)" >> "$GITHUB_ENV"
          echo "IOS_VERSION=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)".*/\1/p' ios/project.yml)" >> "$GITHUB_ENV"

      - name: Version above the latest approved on the App Store
        run: node .github/release/app-store-connect.mjs check-version "$ASC_APP_ID" "$IOS_VERSION"

      - name: iOS build number
        run: sed -i -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" ios/GitWallpaper.xcodeproj/project.pbxproj

      - name: Build and submit to TestFlight
        run: eas build --platform ios --profile production --non-interactive --auto-submit --wait --json > "$RUNNER_TEMP/eas-build.json"

      - name: Build processed on App Store Connect
        run: node .github/release/app-store-connect.mjs wait-for-build "$ASC_APP_ID" "$IOS_VERSION" "$BUILD_NUMBER" 45

      - name: Release notes
        if: env.IS_TAG == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          mkdir -p "$RUNNER_TEMP/metadata/$NOTES_LOCALE"
          bash .github/release/release-notes.sh "$NOTES_MAX_LENGTH" "$NOTES_FALLBACK" "$TAG" | tee "$RUNNER_TEMP/metadata/$NOTES_LOCALE/release_notes.txt"

      - name: Submit for App Store review
        if: env.IS_TAG == 'true'
        run: |
          sudo gem install fastlane -v "$FASTLANE_VERSION" --no-document
          fastlane run deliver \
            api_key_path:"$RUNNER_TEMP/asc-api-key.json" \
            app_identifier:"$IOS_BUNDLE_ID" \
            app_version:"$VERSION" \
            metadata_path:"$RUNNER_TEMP/metadata" \
            skip_binary_upload:true \
            skip_screenshots:true \
            submit_for_review:true \
            automatic_release:true \
            run_precheck_before_submit:false \
            force:true

  github-release:
    name: GitHub release
    needs: [plan, android]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-aab-${{ needs.plan.outputs.version_code }}
          path: android

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/apk/release/app-release.apk "git-wallpaper-${GITHUB_REF_NAME}.apk"
          cp android/bundle/release/app-release.aab "git-wallpaper-${GITHUB_REF_NAME}.aab"
          gh release create "$GITHUB_REF_NAME" "git-wallpaper-${GITHUB_REF_NAME}.apk" "git-wallpaper-${GITHUB_REF_NAME}.aab" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Git Wallpaper ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
